apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oneshot-nginx
  labels:
    app.kubernetes.io/name: oneshot
    app.kubernetes.io/component: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: {{ .Values.nginx.ingress.timeouts.readTimeout | default "300" | quote }}
    nginx.ingress.kubernetes.io/proxy-send-timeout: {{ .Values.nginx.ingress.timeouts.sendTimeout | default "300" | quote }}
    nginx.ingress.kubernetes.io/proxy-connect-timeout: {{ .Values.nginx.ingress.timeouts.connectTimeout | default "300" | quote }}
    nginx.ingress.kubernetes.io/proxy-keepalive-timeout: {{ .Values.nginx.ingress.timeouts.readTimeout | default "300" | quote }}
spec:
  {{- if .Values.nginx.ingress.className }}
  ingressClassName: {{ .Values.nginx.ingress.className }}
  {{- end }}
  tls:
    - hosts:
        - {{ .Values.nginx.ingress.host }}
      secretName: {{ .Values.nginx.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.nginx.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oneshot-nginx
                port:
                  number: {{ .Values.nginx.service.port }}
