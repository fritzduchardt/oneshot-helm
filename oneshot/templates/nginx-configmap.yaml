apiVersion: v1
kind: ConfigMap
metadata:
  name: oneshot-nginx
  labels:
    app.kubernetes.io/name: oneshot
    app.kubernetes.io/component: nginx
data:
  oneshot.conf: |
    server {
      listen {{ .Values.nginx.service.targetPort }};
      server_name _;

      auth_basic "Authentication Required";
      auth_basic_user_file /etc/nginx/auth/.htpasswd;

      location /backend/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Accel-Buffering no;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 24h;
        proxy_send_timeout 300s;
        # Disable buffering for SSE: prevents nginx from holding response data
        # until buffer fills, which stalls event-stream and blocks other requests
        proxy_buffering off;
        proxy_cache off;
        # Flush partial responses immediately to the client
        rewrite ^/backend/(.*)$ /$1 break;
        proxy_pass http://oneshot:{{ .Values.oneshot.service.port }};
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
      }

      location /image/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_pass http://oneshot:{{ .Values.oneshot.service.port }};
      }

      location ~* ^/(manifest\.json|sw\.js)$ {
        auth_basic off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_pass http://oneshot-ui:{{ .Values.oneshotUi.service.port }};
      }

      location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_pass http://oneshot-ui:{{ .Values.oneshotUi.service.port }};
      }
    }
