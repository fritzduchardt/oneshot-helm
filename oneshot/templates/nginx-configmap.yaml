apiVersion: v1
kind: ConfigMap
metadata:
  name: oneshot-nginx
  labels:
    app.kubernetes.io/name: oneshot
    app.kubernetes.io/component: nginx
data:
  oneshot.conf: |
    server {
      listen {{ .Values.nginx.service.targetPort }};
      server_name _;

      auth_basic "Authentication Required";
      auth_basic_user_file /etc/nginx/auth/.htpasswd;

      location /backend/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        rewrite ^/backend/(.*)$ /$1 break;
        proxy_pass http://oneshot:{{ .Values.oneshot.service.port }};
      }

      # SSE streaming endpoint - disable buffering to forward chunks immediately
      location /backend/stream {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Disable buffering so SSE events are forwarded immediately
        proxy_buffering off;
        proxy_cache off;
        # Keep connection alive for SSE
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
        rewrite ^/backend/(.*)$ /$1 break;
        proxy_pass http://oneshot:{{ .Values.oneshot.service.port }};
      }

      location /image/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_pass http://oneshot:{{ .Values.oneshot.service.port }};
      }

      location ~* ^/(manifest\.json|sw\.js)$ {
        auth_basic off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_pass http://oneshot-ui:{{ .Values.oneshotUi.service.port }};
      }

      location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_pass http://oneshot-ui:{{ .Values.oneshotUi.service.port }};
      }
    }