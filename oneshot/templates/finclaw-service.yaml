apiVersion: v1
kind: Service
metadata:
  name: finclaw
  labels:
    app.kubernetes.io/name: oneshot
    app.kubernetes.io/component: finclaw
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: oneshot
    app.kubernetes.io/component: finclaw
  ports:
    - name: http
      port: {{ .Values.finclaw.service.port }}
      targetPort: {{ .Values.finclaw.service.targetPort }}