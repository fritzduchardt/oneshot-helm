registry: 'ghcr.io/fritzduchardt'

nginx:
  image: nginx
  tag: '1.29'
  imagePullPolicy: Always
  replicas: 1
  service:
    port: 80
    targetPort: 8080
  ingress:
    className: 'nginx'
    host: fritzgpt.duchardt.net
    tlsSecretName: oneshot-certificate
    clusterIssuer: http01
  basicAuthSecret: oneshot-ui-basic-auth

oneshotUi:
  image: oneshot-ui
  tag: main
  imagePullPolicy: Always
  replicas: 1
  service:
    port: 3000
    targetPort: 3000
  env:
    PORT: '3000'
    API_URL: https://fritzgpt.duchardt.net/backend

oneshot:
  image: oneshot
  tag: main
  imagePullPolicy: Always
  replicas: 1
  service:
    port: 8000
    targetPort: 8000
  config:
    oneshotEnvFile: /app/.oneshot/.env
    oneshotPatternPath: /app/.oneshot/patterns
    envSecretName: oneshot-env-file
  env:
    PORT: '8000'
    OS_CONFIG_ENV_FILE: /app/.oneshot/.env
    # rendered patterns for usage by oneshot
    OS_CONFIG_PATTERN_DIR: /app/.oneshot/patterns
    # base dir for all markdown files including patterns and data files
    OS_MARKDOWN_BASE_DIR: /sync
    # markdown obsidian vault 1
    OS_MARKDOWN_VAULT_DIR_1: FritzSync/private
    # markdown obsidian vault 2
    OS_MARKDOWN_VAULT_DIR_2: BubaFritzShare/private
    # location of pattern templates
    OS_PATTERN_TEMPLATE_DIR: /sync/FritzSync/patterns
    # rendered pattern in sync dir to pass to other services
    OS_SYNC_PATTERN_DIR: /sync/oneshot/patterns
    LOG_LEVEL: info
    MCP_URL_ONESHOT: http://oneshot-mcp:9000
    MCP_URL_FINCLAW: http://finclaw:9000
    WEAVIATE_HOST: weaviate.weaviate
    WEAVIATE_PORT: '80'
    WEAVIATE_GRPC_HOST: weaviate-grpc.weaviate
    WEAVIATE_GRPC_PORT: '50051'
    TELEGRAM_BOT_TOKEN: ''
    TELEGRAM_CHAT_ID: ''
  nodeSelector:
    kubernetes.io/hostname: friclu-1
  host:
    syncDir: '/volumes/syncthing'

oneshotMcp:
  enabled: true
  image: oneshot-mcp
  tag: main
  imagePullPolicy: Always
  replicas: 1
  service:
    port: 9000
    targetPort: 9000
  env:
    PORT: '9000'
    # rendered pattern for weaviate indexing
    OS_SYNC_PATTERN_DIR: /sync/oneshot/patterns
    # markdown obsidian files base
    OS_MARKDOWN_BASE_DIR: /sync
    # markdown obsidian vault 1
    OS_MARKDOWN_VAULT_DIR_1: FritzSync/private
    # markdown obsidian vault 2
    OS_MARKDOWN_VAULT_DIR_2: BubaFritzShare/private
    # location of pattern templates
    OS_PATTERN_TEMPLATE_DIR: /sync/FritzSync/patterns
    LOG_LEVEL: info
    WEAVIATE_HOST: weaviate.weaviate
    WEAVIATE_PORT: '80'
    WEAVIATE_GRPC_HOST: weaviate-grpc.weaviate
    WEAVIATE_GRPC_PORT: '50051'
    MONGO_HOST: mongodb
  nodeSelector:
    kubernetes.io/hostname: friclu-1

finclaw:
  enabled: true
  image: finclaw
  tag: main
  imagePullPolicy: Always
  replicas: 1
  service:
    port: 9000
    targetPort: 9000
  env:
    PORT: '9000'
    LOG_LEVEL: info
    PGHOST: oneshot-rw
    PGDATABASE: oneshot
    PGUSER: app
    # rendered patterns for AI
    OS_SYNC_PATTERN_DIR: /sync/oneshot/patterns
  scrapers: []
